<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement, équipes & tournois</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c4e80">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Classement">
<style>
:root{
  --bg:#e9eef2; --surface:#ffffff; --ink:#13233a; --muted:#5d6b7d; --line:#d3dbe3;
  --court:#1c4e80; --court-ink:#ffffff; --court-soft:#dbe7f3;
  --red:#d3372e; --green:#1d8a4b; --gold:#c8961e; --silver:#8c98a6; --bronze:#a8683a;
  --num:"Bahnschrift","DIN Alternate","DIN Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1823; --surface:#172332; --ink:#e7edf4; --muted:#93a2b5; --line:#2a3a4d;
    --court:#4b8fd1; --court-ink:#07121e; --court-soft:#1d3550;
    --red:#ef6a60; --green:#46c07c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1823; --surface:#172332; --ink:#e7edf4; --muted:#93a2b5; --line:#2a3a4d;
  --court:#4b8fd1; --court-ink:#07121e; --court-soft:#1d3550; --red:#ef6a60; --green:#46c07c;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--court);outline-offset:2px}

/* En-tête : bande de terrain */
.top{background:var(--court);color:var(--court-ink);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:3px solid currentColor;border-radius:50%;opacity:.18;pointer-events:none}
.top-in{max-width:1100px;margin:0 auto;padding:14px 16px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{font-family:var(--num);font-weight:700;font-size:1.55rem;letter-spacing:.01em;margin:0;line-height:1.1}
.top small{opacity:.8}
.top .spacer{flex:1}
.top select{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);color:inherit;border-radius:8px;padding:8px 10px;min-width:180px}
.top select option{color:#13233a}
nav{background:var(--court);border-top:1px solid rgba(255,255,255,.18);position:sticky;top:0;z-index:5}
nav .in{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--court-ink);opacity:.72;padding:12px 14px;white-space:nowrap;border-bottom:4px solid transparent;font-weight:600}
nav button.on{opacity:1;border-bottom-color:var(--court-ink)}

main{max-width:1100px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
h2{font-family:var(--num);font-size:1.3rem;margin:0 0 10px;font-weight:700}
h3{font-size:1rem;margin:0 0 8px}
.muted{color:var(--muted)}
.row-f{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.btn.danger{color:var(--red);border-color:currentColor;background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.num{width:78px;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--num);font-size:1.1rem;text-align:center}
.txt{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);flex:1;min-width:180px}
textarea.txt{width:100%;min-height:110px;resize:vertical}
select.sel{padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);min-width:0;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--court);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 14px;font-weight:600;color:var(--court)}
.seg button.on{background:var(--court);color:var(--court-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--num);font-size:1.05rem;min-width:44px;min-height:40px}
.chip.on{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.lbl{font-size:.9rem;color:var(--muted);display:block;margin-bottom:6px}

/* Tableau de classement */
.board{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.board li{display:grid;grid-template-columns:40px 58px 1fr auto 52px 64px;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:62px}
.board li:last-child{border-bottom:0}
.board li.sel{background:var(--court-soft)}
.board li.absent .nm{opacity:.5}
.pick{width:30px;height:30px;border-radius:7px;border:2px solid var(--line);background:transparent;padding:0;font-weight:700;color:var(--court-ink)}
li.sel .pick{background:var(--court);border-color:var(--court)}
.rk{font-family:var(--num);font-size:1.7rem;font-weight:700;text-align:center;line-height:1;color:var(--muted)}
li.p1 .rk{color:var(--gold)} li.p2 .rk{color:var(--silver)} li.p3 .rk{color:var(--bronze)}
li.p1,li.p2,li.p3{box-shadow:inset 5px 0 0 var(--c)}
li.p1{--c:var(--gold)} li.p2{--c:var(--silver)} li.p3{--c:var(--bronze)}
.nm{font-weight:600;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis}
.mv{font-style:normal;font-family:var(--num);font-size:.9rem;margin-left:8px;padding:1px 6px;border-radius:5px}
.mv.up{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.mv.down{color:var(--red);background:color-mix(in srgb,var(--red) 14%,transparent)}
.pts{font-family:var(--num);font-size:1.9rem;font-weight:700;text-align:right;min-width:60px;font-variant-numeric:tabular-nums}
.pts small{font-size:.8rem;color:var(--muted);font-weight:400;margin-left:2px}
.pm{height:46px;border-radius:10px;border:0;font-family:var(--num);font-size:1.3rem;font-weight:700}
.pm.minus{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.pm.plus{background:var(--court);color:var(--court-ink)}
.flash{animation:flash .9s ease}
@keyframes flash{from{background:color-mix(in srgb,var(--green) 25%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion: reduce){.flash{animation:none}}
.selbar{position:sticky;top:50px;z-index:4;background:var(--ink);color:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.selbar .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.4)}
.selbar .btn.primary{background:var(--surface);color:var(--ink);border-color:var(--surface)}
@media (max-width:560px){
  .board li{grid-template-columns:30px 40px 1fr auto;grid-template-areas:"p r n s" "m m pl pl";row-gap:6px}
  .board li .pick{grid-area:p} .board li .rk{grid-area:r} .board li .nm{grid-area:n} .board li .pts{grid-area:s}
  .board li .minus{grid-area:m} .board li .plus{grid-area:pl}
}

/* Élèves */
.stu{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.stu:last-child{border-bottom:0}
.toggle{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;background:transparent;font-size:.85rem;font-weight:600;min-width:84px}
.toggle.on{background:color-mix(in srgb,var(--green) 16%,transparent);border-color:var(--green);color:var(--green)}
.sx{width:44px;height:40px;border-radius:9px;border:1.5px dashed var(--line);background:transparent;font-weight:700;font-family:var(--num);font-size:1.05rem;color:var(--muted)}
.sx.F,.sx.G{border-style:solid;border-color:var(--court);background:var(--court-soft);color:var(--ink)}
.sxt{font-size:.75rem;font-weight:700;color:var(--muted);margin-left:4px}
.mixbox{border:1.5px dashed var(--court);border-radius:10px;padding:10px 12px;margin-top:12px}
.mixrow{display:flex;gap:8px;align-items:center;padding:4px 0}
.mixrow span{flex:1}
.mixrow button{min-width:74px}
.x{border:0;background:transparent;color:var(--red);font-size:1.4rem;width:40px;height:40px;border-radius:8px}

/* Présences */
.pres{display:flex;flex-wrap:wrap;gap:6px}
.pres button{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;font-size:.92rem}
.pres button.on{border-color:var(--court);background:var(--court-soft);font-weight:600}
.pres button:not(.on){text-decoration:line-through;opacity:.6}

/* Équipes */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.team header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:3px solid var(--tc)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--tc);border:1.5px solid rgba(0,0,0,.2);flex:none}
.team header b{flex:1}
.team header span{font-family:var(--num);color:var(--muted)}
.team ul{list-style:none;margin:0;padding:4px 0}
.team li button{width:100%;display:flex;gap:8px;align-items:center;border:0;background:transparent;padding:7px 12px;text-align:left}
.team li button.swap{background:var(--court-soft);outline:2px dashed var(--court);outline-offset:-2px}
.team li .r{font-family:var(--num);width:26px;color:var(--muted)}
.team li .n{flex:1}
.team li .p{font-family:var(--num)}

/* Tournoi */
.pool{margin-bottom:18px}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.st th,table.st td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
table.st th{font-size:.82rem;color:var(--muted);font-weight:600}
table.st td.tn{text-align:left;font-weight:600}
table.st td.big{font-family:var(--num);font-size:1.15rem;font-weight:700}
.tw{overflow-x:auto}
.round{margin-top:12px}
.round h4{margin:0 0 6px;font-size:.9rem;color:var(--muted)}
.match{display:grid;grid-template-columns:1fr 64px 12px 64px 1fr;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.match .a{text-align:right}
.match .num{width:64px}
.match .win{font-weight:700;color:var(--green)}
.tname{display:inline-flex;gap:6px;align-items:center}

/* Défis */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.side .fav{font-size:.8rem;font-weight:700;color:var(--court)}
.vs{font-family:var(--num);font-size:2rem;font-weight:700;align-self:center;color:var(--muted)}
.gain{font-family:var(--num);font-size:1.25rem}
.gain b{font-size:1.7rem;color:var(--green)}
.gain .l{color:var(--red)}
@media (max-width:640px){.duel{grid-template-columns:1fr}.vs{text-align:center}}
table.bar{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
table.bar td,table.bar th{padding:6px 8px;border:1px solid var(--line);text-align:center}
table.bar th{font-weight:600;font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.grid2 label{font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* Historique */
.hist{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist time{font-family:var(--num);color:var(--muted);min-width:92px;font-size:.92rem}
.hist div{flex:1}
.empty{text-align:center;padding:36px 16px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Barre des classes */
.classbar{max-width:1100px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:thin}
.classbar .cl-l{opacity:.85;font-size:.9rem;white-space:nowrap;min-width:64px}
.icons{display:flex;flex-wrap:wrap;gap:6px}.icons button{font-size:1.4rem;width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}.icons button.on{border-color:var(--court);background:var(--court-soft)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background:var(--c)}.sw.on{border-color:var(--ink)}
.classbar button{border:1.5px solid rgba(255,255,255,.5);background:transparent;color:inherit;border-radius:999px;padding:7px 15px;font-weight:600;white-space:nowrap;min-height:40px}
.classbar button.on{background:var(--court-ink);color:var(--court);border-color:var(--court-ink)}
.classbar button.ghost{border-style:dashed}
/* Classes et import */
.cls{display:grid;grid-template-columns:1fr 84px 175px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cls:last-of-type{border-bottom:0}
.cls.on .txt{border-color:var(--court)}
@media (max-width:560px){.cls{grid-template-columns:1fr auto;}.cls .muted{grid-column:1}}
.imp-cls{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.imp-cls p{margin:4px 0 0;font-size:.9rem}
.tag{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--court-soft);color:var(--court);margin-left:6px}
.tag.old{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted);min-width:200px;flex:1}
.field select{color:var(--ink)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div><h1 id="actTitle"></h1><small id="classInfo"></small></div>
</div>
<div class="classbar" id="actBar"></div>
<div class="classbar" id="classBar"></div></header>
<nav><div class="in" id="tabs"></div></nav>
<main id="app"></main>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="xlsIn" accept=".xlsx,.xlsm,.csv,.txt,.xls" hidden>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ====== Données ====== */
const KEY = "eps-classement-v1";
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const TEAM_COLORS = [["Rouge","#d64545"],["Bleue","#3b6fd6"],["Verte","#2f9e5b"],["Jaune","#e0b21f"],["Orange","#e57a2e"],["Violette","#8a4fd1"],["Rose","#de5b9b"],["Turquoise","#1fa9b8"],["Marron","#8b5a3c"],["Grise","#7b8490"],["Noire","#2b2b2b"],["Blanche","#e6e6e6"]];

function defaultSettings(){
  return {
    step: 1,
    team: { mode: "homo", by: "count", n: 4, k: 4, mix: false },
    tour: { mode: "rr", pools: 2, w: 3, d: 1, l: 0, sw: 3, sd: 1, sl: 0 },
    chFmt: 1,
    ch: { base: 10, perRank: 2, min: 2, max: 30, loserLoses: false, loserPct: 50, lose: 1 }
  };
}
const ACT_COLORS = ["#1c4e80","#b5462f","#1f7a52","#6b3fa0","#a26a12","#0f6e7a","#a23a6e","#3d4a5c"];
const ACT_ICONS = ["🏅","🏀","🏸","🧭","🏐","⚽","🤾","🏃","🏓","🎾","🤸","🏊","🧗","🏉","💃","🎯","🥋","🚴"];
function guessIcon(n){
  const t = n.toLowerCase();
  const m = [[/basket/,"🏀"],[/badm/,"🏸"],[/orient|co\b/,"🧭"],[/volley/,"🏐"],[/foot/,"⚽"],[/hand/,"🤾"],[/course|athl|demi-fond|vitesse|relais|endurance/,"🏃"],[/ping|tennis de table/,"🏓"],[/tennis/,"🎾"],[/gym|acro/,"🤸"],[/nat|piscine/,"🏊"],[/escalade|grimpe/,"🧗"],[/rugby/,"🏉"],[/danse|cirque/,"💃"],[/tir|arc/,"🎯"],[/judo|lutte|combat|boxe/,"🥋"],[/v[ée]lo|cycl/,"🚴"]];
  return (m.find(([re]) => re.test(t)) || [0,"🏅"])[1];
}
function newClass(name){ return { id: uid(), name, students: [] }; }
function newActivity(name, settings, color){ return { id: uid(), name, icon: guessIcon(name), color: color || ACT_COLORS[0], settings: settings ? JSON.parse(JSON.stringify(settings)) : defaultSettings() }; }
function defaultState(){ const c = newClass("Ma classe"), a = newActivity("Mon activité"); return { classes: [c], cur: c.id, activities: [a], curAct: a.id, recs: {} }; }
function normSettings(x){
  const st = Object.assign(defaultSettings(), x || {});
  for (const k of ["team","tour","ch"]) st[k] = Object.assign(defaultSettings()[k], st[k] || {});
  return st;
}
function normalize(s){
  if (!Array.isArray(s.classes) || !s.classes.length){ const c = newClass("Ma classe"); s.classes = [c]; s.cur = c.id; }
  s.recs ||= {};
  if (!Array.isArray(s.activities) || !s.activities.length){
    // Ancienne version sans activités : tout est rangé dans une première activité
    const a = newActivity("Mon activité", s.settings);
    s.activities = [a]; s.curAct = a.id;
    s.classes.forEach(c => {
      const pts = {}; (c.students || []).forEach(st => { if (st.points) pts[st.id] = st.points; });
      s.recs[a.id + "|" + c.id] = { pts, history: c.history || [], teams: c.teams || null, tour: c.tour || null };
    });
  }
  delete s.settings;
  s.classes.forEach(c => {
    c.students = (c.students || []).map(st => ({ id: st.id, name: st.name, present: st.present !== false, sex: st.sex === "F" || st.sex === "G" ? st.sex : "" }));
    delete c.history; delete c.teams; delete c.tour;
  });
  s.activities.forEach(a => { a.settings = normSettings(a.settings); a.icon ||= guessIcon(a.name); a.color ||= ACT_COLORS[0]; });
  if (!s.classes.some(c => c.id === s.cur)) s.cur = s.classes[0].id;
  if (!s.activities.some(a => a.id === s.curAct)) s.curAct = s.activities[0].id;
  return s;
}
function load(){ try { const r = localStorage.getItem(KEY); if (r) return normalize(JSON.parse(r)); } catch(e){} return defaultState(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Enregistrement impossible dans ce navigateur : exportez une sauvegarde."); } }

let S = load();
let imp = null;
let view = "rank", sel = new Set(), motif = "", moved = new Map(), movedT = null, swapSel = null, chSel = { a: [], b: [] }, flashIds = new Set();

const A = () => S.activities.find(a => a.id === S.curAct) || S.activities[0];
const ST = () => A().settings;
const K = () => S.classes.find(c => c.id === S.cur) || S.classes[0];
function rec(aId, cId){ const key = aId + "|" + cId; return S.recs[key] ||= { pts: {}, history: [], teams: null, tour: null }; }
/* Vue « activité + classe » : les élèves viennent de la classe, les points et le reste de l'activité */
function C(){
  const k = K(), r = rec(A().id, k.id);
  const wrap = s => ({ _s: s, get id(){ return s.id; }, get name(){ return s.name; }, set name(v){ s.name = v; },
    get present(){ return s.present; }, set present(v){ s.present = v; },
    get sex(){ return s.sex || ""; }, set sex(v){ s.sex = v; },
    get points(){ return r.pts[s.id] || 0; }, set points(v){ r.pts[s.id] = v; } });
  return { _k: k, _r: r, id: k.id, get name(){ return k.name; }, set name(v){ k.name = v; },
    get students(){ return k.students.map(wrap); }, set students(v){ k.students = v.map(w => w._s || w); },
    get history(){ return r.history; }, set history(v){ r.history = v; },
    get teams(){ return r.teams; }, set teams(v){ r.teams = v; },
    get tour(){ return r.tour; }, set tour(v){ r.tour = v; } };
}
function applyTheme(){
  const a = A(), st = document.documentElement.style;
  st.setProperty("--court", a.color); st.setProperty("--court-ink", "#ffffff");
  st.setProperty("--court-soft", `color-mix(in srgb, ${a.color} 16%, transparent)`);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", a.color);
}
function switchCtx(){ sel.clear(); swapSel = null; chSel = { a: [], b: [] }; moved = new Map(); save(); render(); }
const stu = (id, c = C()) => c.students.find(s => s.id === id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const plural = (n, w) => `${n} ${w}${Math.abs(n) > 1 ? "s" : ""}`;
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);

function ranking(c = C()){
  const list = [...c.students].sort((x, y) => y.points - x.points || x.name.localeCompare(y.name, "fr"));
  const rank = new Map(); let r = 0, prev = null;
  list.forEach((s, i) => { if (s.points !== prev){ r = i + 1; prev = s.points; } rank.set(s.id, r); });
  return { list, rank };
}

/* Toute modification de points passe ici => historique annulable */
function applyChanges(changes, text, kind = "pts"){
  const c = C();
  changes = changes.filter(ch => ch.delta !== 0 && stu(ch.sid, c));
  if (!changes.length) return null;
  changes.forEach(ch => { stu(ch.sid, c).points += ch.delta; flashIds.add(ch.sid); });
  const h = { id: uid(), t: Date.now(), text, kind, changes };
  c.history.unshift(h);
  if (c.history.length > 800) c.history.length = 800;
  save();
  return h.id;
}
function track(fn){
  const before = ranking().rank; const res = fn(); const after = ranking().rank;
  moved = new Map();
  after.forEach((r, id) => { const b = before.get(id); if (b && b !== r) moved.set(id, b - r); });
  clearTimeout(movedT);
  movedT = setTimeout(() => { moved = new Map(); if (view === "rank") rerender(); }, 6000);
  return res;
}
function give(ids, delta){
  const c = C();
  const names = ids.map(id => stu(id, c)?.name).filter(Boolean);
  const who = names.length > 3 ? plural(names.length, "élève") : names.join(", ");
  track(() => applyChanges(ids.map(id => ({ sid: id, delta })), `${sgn(delta)} pt${Math.abs(delta) > 1 ? "s" : ""} : ${who}${motif ? " (" + motif + ")" : ""}`));
  render();
}

/* ====== Équipes ====== */
function teamAvg(t, c = C()){
  const m = t.members.map(id => stu(id, c)).filter(Boolean);
  return m.length ? m.reduce((a, s) => a + s.points, 0) / m.length : 0;
}
function buildTeams(shuffle){
  const c = C(), cfg = ST().team;
  let pres = c.students.filter(s => s.present !== false).map(s => ({ s, r: Math.random() }));
  pres.sort((x, y) => y.s.points - x.s.points || (shuffle ? x.r - y.r : x.s.name.localeCompare(y.s.name, "fr")));
  pres = pres.map(o => o.s);
  const N = pres.length;
  if (N < 2){ toast("Il faut au moins 2 élèves présents."); return; }
  let n = cfg.by === "count" ? cfg.n : Math.floor(N / Math.max(1, cfg.k));
  n = Math.max(2, Math.min(n || 2, N));
  const teams = Array.from({ length: n }, (_, i) => {
    const [nm, col] = TEAM_COLORS[i % TEAM_COLORS.length];
    return { id: uid(), name: "Équipe " + nm + (i >= TEAM_COLORS.length ? " " + (Math.floor(i / TEAM_COLORS.length) + 1) : ""), color: col, members: [] };
  });
  const mix = !!cfg.mix;
  const SX = new Map(pres.map(s => [s.id, s.sex || ""]));
  if (mix){
    // Mixité : chaque groupe (filles, garçons, non renseignés) est réparti à parts égales entre les équipes
    const groups = ["F", "G", ""].map(k => pres.filter(s => (s.sex || "") === k)).filter(g => g.length);
    const cnt = new Array(n).fill(0);
    const quotas = groups.map(g => {
      const q = new Array(n).fill(Math.floor(g.length / n));
      q.forEach((v, t) => cnt[t] += v);
      const order = [...Array(n).keys()].sort((a, b) => cnt[a] - cnt[b] || a - b);
      for (let i = 0; i < g.length % n; i++){ q[order[i]]++; cnt[order[i]]++; }
      return q;
    });
    if (cfg.mode === "niveau"){
      groups.forEach((g, gi) => { let i = 0; teams.forEach((t, ti) => { const k = quotas[gi][ti]; t.members.push(...g.slice(i, i + k).map(s => s.id)); i += k; }); });
    } else {
      const tot = new Array(n).fill(0);
      groups.forEach((g, gi) => {
        const left = [...quotas[gi]], got = new Array(n).fill(0);
        g.forEach((s, idx) => {
          const cand = [...Array(n).keys()].filter(k => left[k] > 0).map(k => ({ k, r: Math.random() }));
          cand.sort((a, b) => got[a.k] - got[b.k] || tot[a.k] - tot[b.k] || (shuffle ? a.r - b.r : (idx / n | 0) % 2 ? b.k - a.k : a.k - b.k));
          const k = cand[0].k; teams[k].members.push(s.id); tot[k] += s.points; left[k]--; got[k]++;
        });
      });
    }
  }
  if (mix && cfg.mode === "niveau"){
    // déjà réparti
  } else if (cfg.mode === "niveau"){
    const base = Math.floor(N / n), extra = N % n; let i = 0;
    teams.forEach((t, ti) => { const sz = base + (ti < extra ? 1 : 0); t.members = pres.slice(i, i + sz).map(s => s.id); i += sz; });
  } else {
    const tot = new Array(n).fill(0);
    if (!mix) for (let i = 0; i < N; i += n){
      const tier = pres.slice(i, i + n);
      const order = [...Array(n).keys()].map(k => ({ k, t: tot[k], c: teams[k].members.length, r: Math.random() }));
      order.sort((a, b) => a.c - b.c || a.t - b.t || (shuffle ? a.r - b.r : (i / n) % 2 ? b.k - a.k : a.k - b.k));
      tier.forEach((s, j) => { const k = order[j].k; teams[k].members.push(s.id); tot[k] += s.points; });
    }
    // Affinage : échanges qui rapprochent la moyenne de chaque équipe de la moyenne générale
    const P = new Map(c.students.map(s => [s.id, s.points]));
    const g = pres.reduce((a, s) => a + s.points, 0) / N;
    const sum = t => t.members.reduce((a, id) => a + P.get(id), 0);
    for (let it = 0; it < 300; it++){
      let improved = false;
      for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++){
        const A = teams[a], B = teams[b], la = A.members.length, lb = B.members.length;
        const sa = sum(A), sb = sum(B);
        const cost = (x, y) => (x / la - g) ** 2 + (y / lb - g) ** 2;
        let best = null, bestV = cost(sa, sb) - 1e-9;
        for (let i = 0; i < la; i++) for (let j = 0; j < lb; j++){
          if (mix && SX.get(A.members[i]) !== SX.get(B.members[j])) continue;
          const d = P.get(B.members[j]) - P.get(A.members[i]);
          const v = cost(sa + d, sb - d);
          if (v < bestV){ bestV = v; best = [i, j]; }
        }
        if (best){ const [i, j] = best; [A.members[i], B.members[j]] = [B.members[j], A.members[i]]; improved = true; }
      }
      if (!improved) break;
    }
  }
  const { rank } = ranking(c);
  teams.forEach(t => t.members.sort((x, y) => rank.get(x) - rank.get(y)));
  c.teams = teams; swapSel = null; save(); render();
  const unk = mix ? pres.filter(s => !s.sex).length : 0;
  toast(`${plural(n, "équipe")} constituée${n > 1 ? "s" : ""}${mix ? (unk ? `. Mixité : ${plural(unk, "élève")} sans fille/garçon renseigné` : ", filles et garçons répartis") : ""}.`);
}

/* ====== Tournoi ====== */
function roundRobin(ids){
  const a = [...ids]; if (a.length % 2) a.push(null);
  const n = a.length, rounds = [];
  for (let r = 0; r < n - 1; r++){
    const m = [];
    for (let i = 0; i < n / 2; i++){ const x = a[i], y = a[n - 1 - i]; if (x && y) m.push(r % 2 ? [y, x] : [x, y]); }
    rounds.push(m);
    a.splice(1, 0, a.pop());
  }
  return rounds;
}
function genTour(){
  const c = C(), cfg = ST().tour;
  if (!c.teams || c.teams.length < 2){ toast("Constituez d'abord au moins 2 équipes."); return; }
  if (c.tour && !confirm("Remplacer le tournoi en cours ?")) return;
  const teams = c.teams.map(t => ({ ...t, members: [...t.members], avg: teamAvg(t, c) }));
  let groups;
  if (cfg.mode === "rr") groups = [teams.map(t => t.id)];
  else {
    const sorted = [...teams].sort((a, b) => b.avg - a.avg);
    const p = Math.max(1, Math.min(cfg.pools, Math.floor(teams.length / 2)));
    if (p < cfg.pools) toast(`Seulement ${plural(p, "poule")} possible${p > 1 ? "s" : ""} avec ${teams.length} équipes.`);
    const base = Math.floor(sorted.length / p), extra = sorted.length % p; groups = []; let i = 0;
    for (let gi = 0; gi < p; gi++){ const sz = base + (gi < extra ? 1 : 0); groups.push(sorted.slice(i, i + sz).map(t => t.id)); i += sz; }
  }
  const L = "ABCDEFGHIJ";
  const pools = groups.map((ids, gi) => ({
    name: groups.length > 1 ? `Poule ${L[gi]} · niveau ${gi + 1}` : "Tous contre tous",
    teamIds: ids,
    matches: roundRobin(ids).flatMap((m, ri) => m.map(([a, b]) => ({ id: uid(), round: ri + 1, a, b, sa: null, sb: null })))
  }));
  c.tour = { id: uid(), created: Date.now(), mode: cfg.mode, teams, pools, awardHistId: null };
  save(); render();
}
function standings(pool, tour){
  const cfg = ST().tour;
  const rows = pool.teamIds.map(id => ({ t: tour.teams.find(x => x.id === id), j: 0, g: 0, n: 0, p: 0, bp: 0, bc: 0, pts: 0 }));
  const R = id => rows.find(r => r.t.id === id);
  pool.matches.forEach(m => {
    if (m.sa === null || m.sb === null) return;
    const A = R(m.a), B = R(m.b);
    A.j++; B.j++; A.bp += m.sa; A.bc += m.sb; B.bp += m.sb; B.bc += m.sa;
    if (m.sa > m.sb){ A.g++; B.p++; A.pts += cfg.w; B.pts += cfg.l; }
    else if (m.sa < m.sb){ B.g++; A.p++; B.pts += cfg.w; A.pts += cfg.l; }
    else { A.n++; B.n++; A.pts += cfg.d; B.pts += cfg.d; }
  });
  rows.sort((x, y) => y.pts - x.pts || (y.bp - y.bc) - (x.bp - x.bc) || y.bp - x.bp || x.t.name.localeCompare(y.t.name, "fr"));
  return rows;
}
function awardTour(){
  const c = C(), t = c.tour, cfg = ST().tour;
  const all = t.pools.flatMap(p => p.matches), played = all.filter(m => m.sa !== null && m.sb !== null);
  if (!played.length){ toast("Aucun match n'a encore de score."); return; }
  if (played.length < all.length && !confirm(`${all.length - played.length} match(s) sans score. Distribuer quand même ?`)) return;
  const acc = new Map();
  const add = (teamId, v) => t.teams.find(x => x.id === teamId).members.forEach(id => acc.set(id, (acc.get(id) || 0) + v));
  played.forEach(m => {
    if (m.sa > m.sb){ add(m.a, cfg.sw); add(m.b, cfg.sl); }
    else if (m.sa < m.sb){ add(m.b, cfg.sw); add(m.a, cfg.sl); }
    else { add(m.a, cfg.sd); add(m.b, cfg.sd); }
  });
  const hid = track(() => applyChanges([...acc].map(([sid, delta]) => ({ sid, delta })), `Tournoi : points distribués (${plural(played.length, "match")})`, "tour"));
  if (hid){ t.awardHistId = hid; save(); toast("Points du tournoi ajoutés au classement."); }
  render();
}

/* ====== Défis ====== */
function chGain(rW, rL){
  const k = ST().ch, d = rL - rW; // d > 0 : le vainqueur était mieux classé
  const g = d >= 0 ? k.base - k.perRank * d : k.base + k.perRank * -d;
  return Math.round(Math.min(k.max, Math.max(k.min, g)));
}
const chLoss = g => ST().ch.loserLoses ? Math.round(g * ST().ch.loserPct / 100) : 0;
const chConso = () => ST().ch.loserLoses ? 0 : Math.max(0, Math.round(+ST().ch.lose || 0));
function avgRank(ids, rank){ return ids.reduce((a, id) => a + rank.get(id), 0) / ids.length; }
function chWin(side){
  const c = C(), { rank } = ranking(c);
  const W = chSel[side], L = chSel[side === "a" ? "b" : "a"];
  const g = chGain(avgRank(W, rank), avgRank(L, rank)), l = chLoss(g), p = chConso();
  const names = ids => ids.map(id => stu(id, c).name).join(" & ");
  const changes = [...W.map(id => ({ sid: id, delta: g })), ...L.map(id => ({ sid: id, delta: l ? -Math.min(l, Math.max(0, stu(id, c).points)) : p }))];
  const f = ST().chFmt;
  track(() => applyChanges(changes, `Défi ${f === 1 ? "solo" : f + " c. " + f} : ${names(W)} bat ${names(L)} (+${g}${l ? " / −" + l : p ? " / perdant +" + p : ""})`, "defi"));
  toast(`${names(W)} : +${g} pt${g > 1 ? "s" : ""}${f > 1 ? " chacun" : ""}${p ? ` · ${names(L)} : +${p}` : ""}`);
  chSel = { a: [], b: [] };
  render();
}

const colLetter = i => { let s = ""; i++; while (i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
const colIndex = ref => { const m = /^[A-Z]+/.exec(ref); let n = 0; for (const ch of m[0]) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error("zip");
  const cnt = dv.getUint16(e + 10, true); let off = dv.getUint32(e + 16, true);
  const files = {}, td = new TextDecoder();
  for (let n = 0; n < cnt; n++){
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true), xlen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
    files[td.decode(u8.subarray(off + 46, off + 46 + nlen))] = { method, csize, lho };
    off += 46 + nlen + xlen + clen;
  }
  const get = async name => {
    const f = files[name]; if (!f) return null;
    const start = f.lho + 30 + dv.getUint16(f.lho + 26, true) + dv.getUint16(f.lho + 28, true);
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return td.decode(data);
    const out = await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();
    return td.decode(out);
  };
  return { get };
}
async function parseXlsx(buf){
  const z = await readZip(buf), P = new DOMParser();

  const tags = (el, n) => [...el.getElementsByTagNameNS("*", n)];
  const wbTxt = await z.get("xl/workbook.xml"); if (!wbTxt) throw new Error("zip");
  const wb = xml(wbTxt), rels = {};
  const relTxt = await z.get("xl/_rels/workbook.xml.rels");
  if (relTxt) tags(xml(relTxt), "Relationship").forEach(r => rels[r.getAttribute("Id")] = r.getAttribute("Target"));
  const ssTxt = await z.get("xl/sharedStrings.xml");
  const ss = ssTxt ? tags(xml(ssTxt), "si").map(si => tags(si, "t").filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join("")) : [];
  const sheets = [];
  for (const sh of tags(wb, "sheet")){
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    let target = rels[rid]; if (!target) continue;
    target = target.startsWith("/") ? target.slice(1) : (target.startsWith("xl/") ? target : "xl/" + target);
    const txt = await z.get(target); if (!txt) continue;
    const rows = [];
    tags(xml(txt), "row").forEach(r => {
      const ri = (+r.getAttribute("r") || rows.length + 1) - 1, row = [];
      tags(r, "c").forEach(c => {
        const ref = c.getAttribute("r"), col = ref ? colIndex(ref) : row.length, t = c.getAttribute("t");
        const v = tags(c, "v")[0];
        let val = "";
        if (t === "s") val = v ? (ss[+v.textContent] ?? "") : "";
        else if (t === "inlineStr") val = tags(c, "t").map(x => x.textContent).join("");
        else val = v ? v.textContent : "";
        row[col] = val;
      });
      rows[ri] = row;

function parseCsv(text){
  text = text.replace(/^\ufeff/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const d = [";", "\t", ","].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === d){ row.push(f); f = ""; }
    else if (ch === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (ch !== "\r") f += ch;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function readImportFile(f){
  try {
    const buf = await f.arrayBuffer(), head = new Uint8Array(buf.slice(0, 4));
    let sheets;
    if (head[0] === 0x50 && head[1] === 0x4b){
      if (typeof DecompressionStream === "undefined") throw new Error("Ce navigateur est trop ancien pour lire les fichiers Excel. Mettez-le à jour, ou enregistrez le fichier au format CSV depuis Excel.");
      sheets = await parseXlsx(buf);
    } else if (head[0] === 0xd0 && head[1] === 0xcf){
      throw new Error("Les anciens fichiers .xls ne peuvent pas être lus. Dans Excel, faites « Enregistrer sous » au format .xlsx puis importez ce fichier.");
    } else {
      let t; try { t = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch(e){ t = new TextDecoder("windows-1252").decode(buf); }
      sheets = [{ name: f.name.replace(/\.[^.]+$/, ""), rows: parseCsv(t) }];
    }
    sheets = sheets.map(s => ({ name: String(s.name).trim(), rows: Array.from(s.rows, r => Array.from(r || [], v => v == null ? "" : String(v).replace(/\s+/g, " ").trim())) }))
                   .filter(s => s.rows.some(r => r.some(Boolean)));
    if (!sheets.length) throw new Error("Ce fichier ne contient aucune donnée.");
    imp = { file: f.name, sheets, mode: "sheets", header: false, sheet: 0, use: sheets.map(() => true), nameCol: 0, firstCol: -1, classCol: -1, sexCol: -1 };
    guessImport();
    view = "classes"; render();
  } catch(e){
    toast(e && e.message && e.message !== "zip" ? e.message : "Impossible de lire ce fichier. Vérifiez qu'il s'agit bien d'un fichier Excel (.xlsx) ou CSV.");
  }
}
const firstRow = rows => rows.find(r => r.some(Boolean)) || [];
const dataRows = rows => { const ne = rows.filter(r => r.some(Boolean)); return imp.header ? ne.slice(1) : ne; };
function guessImport(){
  const h = firstRow(imp.sheets[0].rows).map(v => v.toLowerCase());
  const find = re => h.findIndex(v => re.test(v));
  const full = find(/nom.*pr[ée]nom|pr[ée]nom.*nom|[ée]l[èe]ve|identit/);
  const nom = h.findIndex(v => /(^|[\s_\-.'])nom/.test(v) && !/pr[ée]nom/.test(v));
  const pre = find(/pr[ée]nom/);
  const cls = find(/classe|division|groupe|^div/);
  imp.sexCol = find(/^(sexe|genre|sx|f\s*\/\s*g|g\s*\/\s*f|h\s*\/\s*f|f\s*\/\s*h)$/);
  imp.header = full >= 0 || nom >= 0 || pre >= 0 || cls >= 0 || imp.sexCol >= 0;
  if (full >= 0 && nom < 0){ imp.nameCol = full; imp.firstCol = -1; }
  else { imp.nameCol = nom >= 0 ? nom : (full >= 0 ? full : 0); imp.firstCol = pre >= 0 && pre !== imp.nameCol && full !== pre ? pre : -1; }
  imp.classCol = cls;
  imp.mode = cls >= 0 ? "column" : "sheets";
}
function parseSex(v){
  v = String(v || "").trim().toLowerCase();
  if (v === "2") return "F";
  if (v === "1") return "G";
  if (/^f/.test(v)) return "F";
  if (/^(g|m|h)/.test(v)) return "G";
  return "";
}
function impClasses(){
  const out = new Map();
  const push = (cn, n, sex) => {
    cn = String(cn || "").trim(); if (!cn || !n) return;
    if (!out.has(cn)) out.set(cn, []);
    const arr = out.get(cn); if (!arr.some(x => x.name.toLowerCase() === n.toLowerCase())) arr.push({ name: n, sex });
  };
  const sexOf = r => imp.sexCol >= 0 ? parseSex(r[imp.sexCol]) : "";
  const nameOf = r => [r[imp.nameCol] || "", imp.firstCol >= 0 ? r[imp.firstCol] || "" : ""].map(s => s.trim()).filter(Boolean).join(" ");
  if (imp.mode === "column"){
    if (imp.classCol < 0) return [];
    dataRows(imp.sheets[imp.sheet].rows).forEach(r => push(r[imp.classCol], nameOf(r), sexOf(r)));
  } else imp.sheets.forEach((s, i) => { if (imp.use[i]) dataRows(s.rows).forEach(r => push(s.name, nameOf(r), sexOf(r))); });
  return [...out].map(([name, students]) => ({ name, students }));
}

function doImport(){
  const classes = impClasses(); if (!classes.length) return;
  let added = 0, created = 0, filled = 0, firstId = null;
  classes.forEach(k => {
    let c = S.classes.find(x => sameName(x.name, k.name));
    if (!c){
      // remplace la classe vide créée par défaut
      const blank = S.classes.length === 1 && !S.classes[0].students.length && S.classes[0].name === "Ma classe" ? S.classes[0] : null;
      if (blank) blank.name = k.name; else S.classes.push(newClass(k.name));
      c = blank || S.classes[S.classes.length - 1]; created++;
    }
    firstId ||= c.id;
    k.students.forEach(x => {
      const old = c.students.find(s => sameName(s.name, x.name));
      if (!old){ c.students.push({ id: uid(), name: x.name, present: true, sex: x.sex }); added++; }
      else if (x.sex && old.sex !== x.sex){ old.sex = x.sex; filled++; }
    });
  });
  S.cur = firstId; imp = null; sel.clear(); chSel = { a: [], b: [] }; swapSel = null;
  save(); render();
  toast(`${plural(added, "élève")} importé${added > 1 ? "s" : ""}${created ? `, ${plural(created, "classe")} créée${created > 1 ? "s" : ""}` : ""}${filled ? `, fille/garçon complété pour ${plural(filled, "élève")}` : ""}.`);
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("input[data-ch]")) e.target.blur();
});
let toastT;
function toast(msg, ms){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms || Math.max(2600, msg.length * 55)); }

if (!C().students.length) view = "classes";
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
